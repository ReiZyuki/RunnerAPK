name: Build Runner APK

on:

  push:

    branches:
      - main

  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-22.04


    steps:

      - name: Checkout

        uses: actions/checkout@v4


      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      - name: Install system dependencies

        run: |

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses-dev \
            cmake \
            libffi-dev \
            libssl-dev


      - name: Install Python tools

        run: |

          python -m pip install --upgrade pip

          python -m pip install \
            python-for-android


      - name: Build APK

        run: |

          p4a apk \
            --private app \
            --package=com.reizyuki.runner \
            --name=Runner \
            --version=1.0.0 \
            --bootstrap=webview \
            --requirements=python3,flask,requests,pytelegrambotapi \
            --permission=INTERNET \
            --permission=READ_EXTERNAL_STORAGE \
            --permission=WRITE_EXTERNAL_STORAGE \
            --port=5000 \
            --arch=arm64-v8a \
            --debug


      - name: Find APK

        run: |

          mkdir -p output

          APK_FILE=$(find . -type f -name "*.apk" | head -n 1)

          echo "APK FOUND: $APK_FILE"

          cp "$APK_FILE" output/Runner.apk


      - name: Upload APK

        uses: actions/upload-artifact@v4

        with:

          name: Runner-APK

          path: output/Runner.apk
