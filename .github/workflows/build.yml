name: Build Runner APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install python-for-android
        run: |
          python -m pip install --upgrade pip
          pip install python-for-android

      - name: Build APK
        run: |
          mkdir -p dist

          p4a apk \
            --private app \
            --package=com.reizyuki.runner \
            --name "Runner" \
            --version=1.0 \
            --bootstrap=webview \
            --requirements=python3,flask,pyjnius \
            --port=5000 \
            --dist_name=runner \
            --arch=arm64-v8a \
            --debug

      - name: Find APK
        run: |
          find . -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Runner-APK
          path: "**/*.apk"
